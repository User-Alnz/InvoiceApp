<div class="paginationComponent">

    <button 
        class="btn paginationBtn"
        (click)="prevPage()"
    >Prev</button>

    <ul>
        @for(page of pages; track $index)
        {
            <li
                (click)="selectPage(page)"
                [class.active]="page === currentPage"
                >{{page}}
            </li>
        }
    </ul>

    <button 
        class="btn paginationBtn"
        (click)="nextPage()"
    >Next</button>

</div>
