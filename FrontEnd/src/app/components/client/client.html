<section class="clientContainer">

    <h1>Clients</h1>

    <div class="clientOptions">
        <input class="clientSearch" type="text" placeholder="rechercher un client">
        <button class="btn">Ajouter un client</button>
    </div>
    <app-create-client></app-create-client>

    <div class="WrapClientDashboard">

        <div class="clientDashboard clientDashboardTitle">
            <p>Nom</p>
            <p>Contact</p>
            <p>Location</p>
            <p>Statut</p>
            <p>Actions</p>
        </div>

        @for (client of clients; track $index) 
        {
            <div class="clientDashboard clientRow">

                <div>
                    <p>{{client.name}}</p>
                </div>

                <div>
                    <p>{{client.email}}</p>
                    <p>{{client.tel}}</p>
                </div>

                <div>
                    <p>{{client.address}}</p>
                    <p>{{client.postalCode}}, {{client.country}}</p>
                </div>

                <div>
                    <div>0 facutres</div>
                    <p>27 factures</p>
                </div>

                <div class="clientDashboardButtons">
                    <button class="btn btn-transparent">
                        <img src="/edit_grey.png" alt="edit client icon">
                    </button>
                    <button class="btn btn-transparent">
                        <img src="/delete_red.png" alt="delete user">
                    </button>
                </div>

            </div>
        }
        <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChange)="onPageChange($event)"
        ></app-pagination>

    </div>
    
</section>
